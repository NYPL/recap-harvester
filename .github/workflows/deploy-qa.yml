name: Deploy to QA

on:
  push:
    branches:
      - qa

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy-qa:
    runs-on: ubuntu-latest
    environment: qa
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::946183545209:role/GithubActionsDeployerRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decode .env file
        run: |
          echo "${{ secrets.ENV_FILE_ENCODED_QA }}" | base64 -d > .env

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: recap-harvester
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --secret id=env_file,src=.env -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:qa-latest

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: recap-harvester
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:qa-latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster recap-harvester-poller-qa \
            --service recap-harvester-poller-qa \
            --force-new-deployment

      - name: Clean up
        run: rm -f .env
